# Job Bank search sources — supplied by Gedeon 2026-08-02.
#
# These are the two queries the whole discovery layer hangs off. Both are
# ordinary public search URLs — the same pages a person browsing Job Bank sees.
#
# STATUS: parameters below are INFERRED from the URL shape and NOT yet verified
# against the live site (this container's egress policy blocks gc.ca). Everything
# marked `inferred: true` must be confirmed by spikes/03_search_listing.py before
# code depends on it.

# ===========================================================================
# APPLICATION POLICY — decided by Gedeon 2026-08-02 (docs/06-decisions.md D6)
#
# The two queues get OPPOSITE role filters, and the reasoning is what makes it
# work: in each queue, filter on whatever is NOT already guaranteed.
#
#   LMIA queue      → sponsorship is PROVEN, role fit is the variable.
#                     Take any role. Do not filter on occupation.
#   International   → role fit is achievable, sponsorship is UNPROVEN.
#                     Spend slots only on his actual profession.
# ===========================================================================

searches:
  - id: lmia_approved
    label: LMIA-approved employers
    url: https://www.jobbank.gc.ca/jobsearch/jobsearch?page=1&sort=M&fskl=101020
    facet: fskl=101020
    priority: 1
    measured_2026_08_02:
      total_postings: 112
      composition: ~70% agriculture, plus physicians, caregivers, butchers
      tech_roles: 2
      email_capable: 75%          # spike 4, n=40
    apply_policy:
      role_filter: NONE
      rationale: >-
        Apply to EVERY posting in this queue regardless of occupation, including
        farm work, greenhouse, labouring, caregiving and butchery. These
        employers have already been through the LMIA process — they have paid
        the fee, run the recruitment and waited out the decision. That
        willingness is far rarer and harder to find than a matching job title,
        and it is the thing that actually converts into a work permit.
      exclusions_only:
        - requires a Canadian licence or certification he cannot hold
        - requires a driver's licence (see profile/PROFILE-GAPS.md item 8)
        - requires existing Canadian work authorisation
        - closing date passed
        - already applied to this employer + NOC within the cooldown window
      cv_track: transferable        # docs/04 Track B, per posting
      note: >-
        Small and slow-moving: 112 total, newest seen was 17 days old. The whole
        queue is roughly 3-4 days of sending. After the initial sweep this
        becomes a monitoring problem, not a volume problem.

  - id: international_candidates
    label: Jobs open to international candidates
    url: https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring=&locationstring=&locationparam=&fglo=1&sort=M
    facet: fglo=1
    priority: 2
    measured_2026_08_02:
      total_postings: 7884
      tech_roles: ~35
      general_roles: ~665
    apply_policy:
      role_filter: TECH_ONLY
      rationale: >-
        Do NOT apply to general work in this queue. These employers accept
        applications from candidates outside Canada but have not demonstrated
        any willingness to sponsor, so a general-labour application here is a
        slot spent with neither sponsorship nor role fit behind it. The 286
        painter and 198 construction-labourer postings in this facet are
        deliberately OUT OF SCOPE.
      include_noc:
        - "21234"   # Web developers and programmers
        - "21233"   # Web designers
        - "21232"   # Software developers and programmers
        - "21230"   # Computer systems developers and programmers
        - "22222"   # Information systems testing technicians
      include_title_keywords:
        - web developer
        - front end developer
        - frontend developer
        - front-end developer
        - software developer
        - full stack developer
        - javascript developer
        - react developer
        - ui developer
        - application developer
        - programmer
        - web designer
      cv_track: direct              # docs/04 Track A
      note: >-
        Title keywords are the fallback where a posting carries no usable NOC.
        Both signals are ORed; a posting matching either is in scope.

# ---------------------------------------------------------------------------
# Volume consequence — worth understanding before building for scale
# ---------------------------------------------------------------------------
volume:
  initial_backlog: ~147            # 112 LMIA (all) + ~35 international tech
  at_30_40_per_day: ~4-5 days
  steady_state: >-
    After the opening sweep this is a MONITORING system, not a bulk sender. New
    LMIA postings arrive slowly. Daily volume drops to whatever was posted since
    the last poll — typically a handful. The 30-40/day cap and the warm-up ramp
    comfortably cover both phases, and the sophisticated ranking layer matters
    far less than first assumed: for the LMIA queue there is nothing to rank,
    because the answer is "all of them".

# ---------------------------------------------------------------------------
# Parameter meanings — INFERRED, pending spike 3
# ---------------------------------------------------------------------------
parameters:
  searchstring:
    inferred: true
    meaning: free-text keyword; empty returns everything
    use: >-
      Leave empty for the broad sweeps. Optionally run extra narrow queries for
      "front end developer", "react developer", "web developer" to catch tech
      postings that sit outside the two facets above.
  locationstring / locationparam:
    inferred: true
    meaning: location filter; empty = nationwide
    use: >-
      Keep empty. Province filtering happens in our own ranking, where it can be
      weighted against PNP activity rather than being a hard cut.
  page:
    inferred: true
    meaning: 1-based pagination
  sort:
    inferred: true
    meaning: "M — believed to be most-recent-first"
    criticality: HIGH
    why: >-
      If M really is newest-first, page 1 of each search is a live feed of new
      postings, and monitoring is just "poll page 1, diff against seen ids".
      That would resolve the freshness gap that the monthly open-data CSV
      cannot. If M means something else (relevance, match), the monitoring
      design needs a different sort value and spike 3 must find it.
  fglo:
    inferred: true
    meaning: facet — open to candidates outside Canada
  fskl:
    inferred: true
    meaning: facet — 101020 believed to be the LMIA / TFW-approved facet
    fragility: >-
      A numeric facet code is an internal identifier. It can change without
      notice and would fail SILENTLY — the query still returns results, just the
      wrong ones. Guard: record the expected result-count magnitude at ingest and
      alert on a large unexplained swing, and assert the facet label text still
      appears on the rendered page.

# ---------------------------------------------------------------------------
# Polling — deliberately conservative
# ---------------------------------------------------------------------------
polling:
  interval_minutes: 60
  pages_per_poll: 1          # page 1 only; deeper paging only on first backfill
  rationale: >-
    Two page loads an hour is less traffic than one person refreshing the site
    over a coffee break. Sort by newest means page 1 is sufficient to catch
    everything as long as fewer than one page of jobs is posted per hour; if the
    diff ever comes back completely new, that is the signal to page deeper.
  backfill:
    pages: 20
    once: true
    note: Paced the same as normal polling. One-time, on first run.
