    completed primary school, high school and further study there. From high
    school onward he worked through the short and long school holidays — first
    to contribute to the household, then to fund his own studies. The manual and
    service jobs below are that period: consecutive, purposeful, and worked
    around school and later online study, ending when he moved into professional
    software work.
