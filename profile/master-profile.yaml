cv_presentation_policy:
  # Gedeon asked for the timeline to be "aligned nicely so it is in order".
  # This is how that is done HONESTLY. Dates are never altered to remove
  # overlaps — that is falsification, and the claim audit blocks it.
  # What actually fixes the appearance is presentation:
  rules:
    - Strict reverse-chronological order by start date within each section.
    - EVERY role carries its employment type — Full-time, Contract,
      Contract Part-time, Freelance, Vacation Employment. This is the single
      change that makes concurrent roles read as normal instead of contradictory.
    - Month-year granularity throughout ("Mar 2019", never "12 March 2019").
    - Long-running self-employment (exp.freelance) is listed once as a single
      continuous entry rather than being interleaved — it is the through-line
      that explains the rest.
    - Professional and general work go in SEPARATE sections. Mixing them is what
      makes a timeline look chaotic.
    - Concurrent roles may carry a short qualifier where it genuinely helps —
      e.g. "alongside full-time study", "evenings and weekends" — but only where
      documented here.
  why_overlaps_are_fine: >-
    Between 2017 and 2022 Gedeon frequently held two or three roles at once:
    full-time IT support, a part-time trades placement, contract retail, and
    continuous freelance development. With employment types shown this is not a
    red flag — it is a documented record of someone working multiple jobs while
    studying. For the general-work applications that make up most of the LMIA
    queue, it is close to the strongest thing on the CV.

