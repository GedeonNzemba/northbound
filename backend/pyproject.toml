[project]
name = "northbound"
version = "0.1.0"
description = "Automated Canadian LMIA job discovery, tailored CV generation, and application pipeline"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
northbound = "northbound.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# `tests` is on the path so the shared fixtures module is importable from every
# test file without a package indirection.
pythonpath = [".", "tests"]
testpaths = ["tests"]
