[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northbound"
version = "0.1.0"
description = "Automated Canadian LMIA job discovery, tailored CV generation, and application pipeline"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
northbound = "northbound.cli:main"

# Without this, setuptools sees both `northbound/` and `tests/` at the top level
# and refuses to guess. Install editable (`pip install -e .`): the profile and
# config are located relative to this file's position in the repo, so a copied
# install would not find them.
[tool.setuptools.packages.find]
include = ["northbound*"]

[project.optional-dependencies]
# pdfplumber gives per-word page coordinates — the only way to test that the
# date column is actually right-aligned, which no text-layer check can see.
dev = ["pytest>=8.0", "pdfplumber>=0.11"]

[tool.pytest.ini_options]
# `tests` is on the path so the shared fixtures module is importable from every
# test file without a package indirection.
pythonpath = [".", "tests"]
testpaths = ["tests"]
